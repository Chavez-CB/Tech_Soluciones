# ==============================================================================
# CONFIGURACIÓN NGINX PARA EL FRONTEND (tech-soluciones.cabanillas.net.pe)
# ==============================================================================

# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name tech-soluciones.cabanillas.net.pe;
    return 301 https://$host$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name tech-soluciones.cabanillas.net.pe;

    # Certificados SSL de LetsEncrypt
    ssl_certificate     /etc/letsencrypt/live/cabanillas.net.pe-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabanillas.net.pe-0002/privkey.pem;
    include snippets/ssl-params.conf;

    location / {
        # Proxy hacia el contenedor del frontend (puerto 3000 interno de vite preview)
        proxy_pass         http://tech-soluciones-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# CONFIGURACIÓN NGINX PARA EL BACKEND (tech-soluciones-backend.cabanillas.net.pe)
# ==============================================================================

# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name tech-soluciones-backend.cabanillas.net.pe;
    return 301 https://$host$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name tech-soluciones-backend.cabanillas.net.pe;

    # Certificados SSL de LetsEncrypt
    ssl_certificate     /etc/letsencrypt/live/cabanillas.net.pe-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabanillas.net.pe-0002/privkey.pem;
    include snippets/ssl-params.conf;

    location / {
        # Proxy hacia el contenedor del backend (puerto 8000 interno)
        proxy_pass         http://tech-soluciones-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
